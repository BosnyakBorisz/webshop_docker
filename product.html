<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7f5">
    <title>Webshop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="container app-header-inner justify-content-between flex-wrap py-3">
            <a href="index.html" class="d-flex align-items-center gap-3 text-decoration-none text-reset">
                <div class="brand-mark shadow-sm" aria-hidden="true">W</div>
                <div>
                    <p class="header-kicker mb-1">WEBSHOP / ADMIN</p>
                    <h1 class="mb-0">Termékek</h1>
                </div>
            </a>
            <nav aria-label="Fő navigáció">
                <div class="nav nav-pills gap-1">
                    <a class="nav-link text-body-secondary" href="index.html">Felhasználók</a>
                    <a class="nav-link active" href="product.html" aria-current="page">Termékek</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="container app-main">
        <section class="user-form-section shadow-sm" aria-labelledby="form-title">
            <div class="section-heading">
                <div>
                    <p class="header-kicker mb-1">KATALÓGUSKEZELÉS</p>
                    <h2 id="form-title" class="mb-0">Új termék</h2>
                </div>
            </div>
            <form id="product-form" class="row g-3">
                <div class="col-12 col-md-6">
                    <label for="product-name" class="form-label">Termék neve</label>
                    <input type="text" class="form-control" id="product-name" minlength="2" required>
                </div>
                <div class="col-6 col-md-3">
                    <label for="product-price" class="form-label">Ár (Ft)</label>
                    <input type="number" class="form-control" id="product-price" min="1" step="1" required>
                </div>
                <div class="col-6 col-md-3">
                    <label for="product-stock" class="form-label">Készlet (db)</label>
                    <input type="number" class="form-control" id="product-stock" min="0" step="1" required>
                </div>
                <div class="col-6 col-md-3">
                    <label for="product-rating" class="form-label">Értékelés (0–5)</label>
                    <input type="number" class="form-control" id="product-rating" min="0" max="5" step="0.1" value="0" required>
                </div>
                <div class="col-6 col-md-3">
                    <label for="manufacturer-name" class="form-label">Gyártó</label>
                    <input type="text" class="form-control" id="manufacturer-name" required>
                </div>
                <div class="col-12 col-md-3">
                    <label for="manufacturer-country" class="form-label">Gyártó országa</label>
                    <input type="text" class="form-control" id="manufacturer-country" required>
                </div>
                <div class="col-12 col-md-3">
                    <label for="product-image" class="form-label">Kép URL</label>
                    <input type="url" class="form-control" id="product-image" placeholder="https://...">
                </div>
                <div class="col-12">
                    <label for="product-features" class="form-label">Jellemzők (vesszővel elválasztva)</label>
                    <input type="text" class="form-control" id="product-features" placeholder="Például: 32 GB RAM, 1 TB SSD">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary px-4" id="product-submit">Termék létrehozása</button>
                </div>
            </form>
            <div id="form-status" class="alert d-none mt-3 mb-0" role="status" aria-live="polite"></div>
        </section>

        <section class="user-list-section" aria-labelledby="list-title">
            <div class="section-heading list-heading">
                <div>
                    <p class="header-kicker mb-1">KÉSZLET ÉS KÍNÁLAT</p>
                    <h2 id="list-title" class="mb-0">Termékkínálat</h2>
                </div>
            </div>
            <div id="products-status" class="alert alert-info shadow-sm" role="status" aria-live="polite">Termékek betöltése...</div>
            <div id="products-list" class="row g-4" aria-live="polite"></div>
        </section>
    </main>
    <script src="product.js"></script>
</body>
</html>
