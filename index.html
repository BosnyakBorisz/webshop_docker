<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7f5">
    <title>Webshop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="container app-header-inner">
            <div class="brand-mark" aria-hidden="true">W</div>
            <div>
                <p class="header-kicker mb-1">WEBSHOP</p>
                <h1 class="mb-0">Felhasználók</h1>
            </div>
        </div>
    </header>

    <main class="container app-main">
        <section class="user-form-section" aria-labelledby="urlap-cim">
            <div class="section-heading">
                <h2 id="urlap-cim" class="mb-0">Új felhasználó</h2>
            </div>
            <form id="felhasznalo-urlap" class="row g-3">
                <div class="col-12 col-md-6">
                    <label for="nev" class="form-label">Név</label>
                    <input type="text" class="form-control" id="nev" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="varos" class="form-label">Város</label>
                    <input type="text" class="form-control" id="varos" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="telefon" class="form-label">Telefon</label>
                    <input type="tel" class="form-control" id="telefon" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="szerepkor" class="form-label">Szerepkör</label>
                    <select class="form-select" id="szerepkor" required>
                        <option value="customer" selected>Vásárló</option>
                        <option value="admin">Adminisztrátor</option>
                        <option value="supplier">Beszállító</option>
                    </select>
                </div>
                <div class="col-12 d-flex align-items-end gap-2">
                    <button type="submit" class="btn btn-primary" id="felhasznaloMentes">
                        Létrehozás
                    </button>
                    <button type="button" class="btn btn-outline-secondary d-none" id="szerkesztesMegse">Mégse</button>
                </div>
            </form>

            <div id="urlap-allapot" class="alert d-none mt-3 mb-0" role="status" aria-live="polite"></div>
        </section>

        <section class="user-list-section" aria-labelledby="lista-cim">
            <div class="section-heading list-heading">
                <h2 id="lista-cim" class="mb-0">Felhasználók</h2>
            </div>
            <div id="users-status" class="alert alert-info" role="status" aria-live="polite">Felhasználók betöltése...</div>
            <div class="table-responsive user-table-wrap">
                <table class="table align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col">Név</th>
                            <th scope="col">E-mail</th>
                            <th scope="col">Város</th>
                            <th scope="col">Telefon</th>
                            <th scope="col">Szerepkör</th>
                            <th scope="col">Műveletek</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
